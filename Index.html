
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopZy - Online Shopping</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>Shop<span>Zy.</span></h2>

  <input type="text" id="search"
  placeholder="Search products...">

  <button class="cart-btn" onclick="showCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <div>
    <p>WELCOME TO SHOPZY</p>
    <h1>Discover Your<br>Favourite Products</h1>
    <p>Best deals. Best quality. Best shopping experience.</p>
    <a href="#products">Shop Now →</a>
  </div>
  <div class="hero-icon">🛍️</div>
</section>

<section class="categories">
  <h2>Shop By Category</h2>
  <div class="category-list">
    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Fashion')">👕 Fashion</button>
    <button onclick="filterCategory('Electronics')">📱 Electronics</button>
    <button onclick="filterCategory('Accessories')">⌚ Accessories</button>
    <button onclick="filterCategory('Home')">🏠 Home</button>
  </div>
</section>

<section class="products" id="products">
  <h2>Popular Products</h2>
  <div class="product-grid" id="productGrid"></div>
</section>

<section class="cart-section" id="cartSection">
  <h2>Your Shopping Cart</h2>
  <div id="cartItems">Your cart is empty.</div>
  <h3 id="total">Total: ₹0</h3>
  <button onclick="checkout()">Proceed to Checkout</button>
</section>

<footer>
  <h2>ShopZy.</h2>
  <p>Your happiness, our priority.</p>
  <p>© 2026 ShopZy. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
